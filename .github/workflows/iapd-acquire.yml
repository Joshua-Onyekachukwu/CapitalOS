name: IAPD Acquisition

# Fetches the SEC's monthly Investment Adviser Information Reports on
# US-hosted runners (SEC properties block non-US traffic, so this cannot
# run from every development machine). Two files per month:
#   - Registered Investment Advisers (~5MB)
#   - Exempt Reporting Advisers (~0.8MB)
# Each unzips to a spreadsheet of Form ADV data (identity, registration,
# business, AUM, employees...). We download both, parse rows into JSONL,
# and upload a raw artifact that scripts/pipeline/run-batch.ts consumes.
#
# Source listing: https://www.sec.gov/data-research/sec-markets-data/
#   information-about-registered-investment-advisers-exempt-reporting-advisers

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max rows per file to emit into the raw JSONL"
        required: false
        default: "120"

concurrency:
  group: iapd-acquire
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install xlsx parser
        run: npm install --no-save xlsx@0.18.5

      - name: Discover latest report URLs
        id: discover
        run: |
          set -e
          LISTING="https://www.sec.gov/data-research/sec-markets-data/information-about-registered-investment-advisers-exempt-reporting-advisers"
          curl -sS --max-time 60 -A "CapitalOS Pipeline admin@capital-os.example" "$LISTING" -o listing.html
          echo "listing bytes: $(wc -c < listing.html)"
          # The page links the monthly zips; pull the most recent RIAdvisers and ERAdvisers hrefs.
          node - <<'EOF'
          const fs = require("fs");
          const html = fs.readFileSync("listing.html", "utf8");
          const hrefs = [...html.matchAll(/href="([^"]+\.zip)"/gi)].map(m => m[1]);
          const abs = [...new Set(hrefs.map(h => new URL(h, "https://www.sec.gov").toString()))];
          // Disambiguate by FILENAME (the directory path contains both words).
          // Exempt reports have "exempt" in the file name; registered ones don't.
          const era = abs.find(u => /exempt[^/]*\.zip$/i.test(u)) || null;
          const ria = abs.find(u => !/exempt/i.test(u.split("/").pop()) && /ia\d{6}|\.zip$/i.test(u)) || null;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ria=${ria || ""}\nera=${era || ""}\n`);
          console.log("all zips:", abs.slice(0, 6));
          console.log("RIA:", ria);
          console.log("ERA:", era);
          if (!ria || !era) { console.error("could not disambiguate zip links"); process.exit(3); }
          EOF

      - name: Download and convert to JSONL
        env:
          RIA_URL: ${{ steps.discover.outputs.ria }}
          ERA_URL: ${{ steps.discover.outputs.era }}
          ROW_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -e
          mkdir -p out
          UA="CapitalOS Pipeline admin@capital-os.example"
          curl -sS --max-time 300 -A "$UA" -o ria.zip "$RIA_URL"
          curl -sS --max-time 120 -A "$UA" -o era.zip "$ERA_URL"
          unzip -o ria.zip -d ria_x >/dev/null; unzip -o era.zip -d era_x >/dev/null
          node scripts/iapd-convert.cjs ria_x out/iapd-advisers.json "$ROW_LIMIT" registered
          node scripts/iapd-convert.cjs era_x out/iapd-exempt.json "$ROW_LIMIT" exempt
          ls -la out
          head -c 600 out/iapd-advisers.json || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iapd-raw
          path: out/
          retention-days: 30
