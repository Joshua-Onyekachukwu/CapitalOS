name: Nightly Security Tests

# Nightly authorization regression suite against production.
#
# Runs the access-control suite (static guard scan + live 401/403 matrix on
# every admin route + IDOR regressions on suppression / warmup /
# dashboard/admin) against the deployed app. On failure it alerts through
# two channels:
#   1. A GitHub issue labeled `security-alert` (deduplicated: the same
#      failing test updates the existing open alert issue).
#   2. A POST to /api/cron/security-alert (CRON_SECRET) recording a failed
#      `security_nightly` row in background_jobs — surfaced in
#      /admin/intelligence via the job_status rollup.
#
# Drills: dispatch with {"force_failure": true} to exercise the full alert
# path end to end without waiting for a real regression. The next passing
# run auto-resolves the alert (issue closed + resolved row).

on:
  schedule:
    # 03:15 UTC daily — after the 03:00 UTC weekly cron window, off the top
    # of the hour to avoid Vercel's scheduled-traffic crunch.
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Drill: run with a deliberately failing assertion"
        required: false
        default: "false"

concurrency:
  group: security-nightly
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  access-control:
    name: Access-control suite (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run access-control suite
        id: suite
        env:
          TEST_URL: https://capital-os-nine.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_FOUNDER_EMAIL: ${{ secrets.TEST_FOUNDER_EMAIL }}
          TEST_FOUNDER_PASSWORD: ${{ secrets.TEST_FOUNDER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_IDOR_VICTIM_ACCOUNT_ID: ${{ secrets.TEST_IDOR_VICTIM_ACCOUNT_ID }}
          TEST_IDOR_VICTIM_USER_ID: ${{ secrets.TEST_IDOR_VICTIM_USER_ID }}
          FORCE_FAILURE: ${{ github.event.inputs.force_failure }}
        run: |
          # GitHub runs steps under `bash -e`: a failing pipeline aborts the
          # script before STATUS capture unless errexit is off. pipefail is
          # needed so $? is vitest's exit code, not tee's.
          set +e
          set -o pipefail
          npx vitest run src/__tests__/access-control.test.ts \
            --reporter=default --outputFile.security=security-results.txt 2>&1 \
            | tee suite-output.txt
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "suite exit: $STATUS"
          # Keep the log bounded for the issue body.
          tail -c 12000 suite-output.txt > security-results.txt
          exit 0  # alerting steps below decide the job outcome

      - name: Fail job on suite failure (after alerting)
        # always() is required: once the suite step fails, the job is in a
        # failing state and steps are skipped unless their condition
        # includes always()/failure() — even when the `if` itself is true.
        if: always() && steps.suite.outputs.status != '0'
        run: |
          echo "Access-control suite failed (exit ${{ steps.suite.outputs.status }}). See alert issue."
          exit 1

      - name: Raise or update security alert issue
        if: always() && steps.suite.outputs.status != '0'
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ github.workspace }}/security-results.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const title = "security: access-control suite failing against production";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const results = fs.existsSync(process.env.RESULTS)
              ? fs.readFileSync(process.env.RESULTS, "utf8")
              : "(no results captured)";
            const body = [
              "The nightly access-control suite failed against production.",
              "",
              `- Run: ${runUrl}`,
              `- Date: ${new Date().toISOString()}`,
              `- Sha: ${process.env.GITHUB_SHA}`,
              "",
              "<details><summary>Suite output (tail)</summary>",
              "",
              "```",
              results,
              "```",
              "",
              "</details>",
              "",
              "This issue is auto-managed: it reopens/updates while failures persist and closes on the next fully passing run.",
            ].join("\n");

            // Deduplicate: reuse the existing open alert issue if present.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security-alert",
              per_page: 10,
            });
            const hit = existing.data.find((i) => i.title === title);

            if (hit) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["security-alert"],
              });
            }

      - name: Resolve alert issue on recovery
        if: always() && steps.suite.outputs.status == '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security-alert",
              per_page: 10,
            });
            const title = "security: access-control suite failing against production";
            for (const issue of existing.data.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved by passing run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      - name: Record outcome in-app (background_jobs)
        if: always()
        run: |
          STATUS="${{ steps.suite.outputs.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${{ github.sha }}"
          if [ "$STATUS" = "0" ]; then
            PAYLOAD=$(printf '{"jobType":"security_nightly","status":"completed","runUrl":"%s","sha":"%s"}' "$RUN_URL" "$SHA")
          else
            PAYLOAD=$(printf '{"jobType":"security_nightly","status":"failed","runUrl":"%s","sha":"%s"}' "$RUN_URL" "$SHA")
          fi
          curl -sS --max-time 30 -X POST \
            "${{ secrets.SECURITY_ALERT_URL || 'https://capital-os-nine.vercel.app/api/cron/security-alert' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "recorded: $PAYLOAD"
